services:
  database:
    image: postgres:15-alpine
    container_name: ekeyc_one
    restart: always
    environment:
      POSTGRES_USER: doduy
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ekyc-onborading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: